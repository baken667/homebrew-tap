name: Audit formulae

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Homebrew's audit rules change over time; catch that without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: brew audit, install and test
    # arm64, matching the darwin_arm64 archive most users will install.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        # macOS runners ship Homebrew already; this only puts it on PATH and
        # updates it. Re-running the install script (as this workflow used to)
        # is slow and can fail outright.
        uses: Homebrew/actions/setup-homebrew@master

      - name: Detect formulae
        id: detect
        run: |
          shopt -s nullglob
          files=(Formula/*.rb)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "Found ${#files[@]} formula file(s)."

      - name: Audit
        if: steps.detect.outputs.count != '0'
        # Deliberately NOT --new: that flag applies homebrew-core submission
        # criteria (repository age, stars, forks) which a personal tap can
        # never satisfy, so it would fail forever. --online is the part that
        # matters here: it fetches the homepage and the release URLs.
        run: brew audit --strict --online --formula Formula/*.rb

      - name: Install and test
        if: steps.detect.outputs.count != '0'
        run: |
          for f in Formula/*.rb; do
            brew install --formula "$f"
            brew test --formula "$f"
          done

name: Audit formulae

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Homebrew's audit rules change over time; catch that without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: brew audit, install and test
    # arm64, matching the darwin_arm64 archive most users will install.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        # macOS runners ship Homebrew already; this only puts it on PATH and
        # updates it. Re-running the install script (as this workflow used to)
        # is slow and can fail outright.
        uses: Homebrew/actions/setup-homebrew@master

      - name: Detect formulae
        id: detect
        run: |
          shopt -s nullglob
          files=(Formula/*.rb)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "Found ${#files[@]} formula file(s)."

      - name: Register this checkout as the tap
        if: steps.detect.outputs.count != '0'
        # brew audit/install/test only accept formula NAMES -- passing a path
        # is disabled outright ("Calling `brew audit [path ...]` is disabled").
        # Naming a formula requires its tap to exist, so link the checkout into
        # Homebrew's taps directory.
        #
        # A symlink rather than `brew tap baken667/tap`: tapping would fetch
        # the published main branch, so a pull request would audit the formula
        # it is replacing instead of the one it proposes.
        run: |
          tap_dir="$(brew --repository)/Library/Taps/baken667/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          rm -rf "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap | grep -q '^baken667/tap$' || { echo "tap did not register"; exit 1; }

      - name: Audit
        if: steps.detect.outputs.count != '0'
        # --online is the part that matters: it fetches the homepage and every
        # release URL and verifies the checksums.
        #
        # NOT --new: that applies homebrew-core submission criteria (repository
        # age, stars, forks) which a personal tap can never satisfy.
        #
        # --except=style,version: both categories fail on any GoReleaser-
        # generated formula, for reasons inherent to the generator rather than
        # defects in the formula. Verified against the real published formula:
        #
        #   style   - a multi-platform formula puts `def install` inside
        #             `on_intel do` / `on_arm do` blocks, and rubocop's
        #             Lint/NestedMethodDefinition rejects defining a method in
        #             a block (4 occurrences, one per platform).
        #   version - GoReleaser writes an explicit `version` field, which
        #             Homebrew calls redundant because it can scan the version
        #             out of the URL.
        #
        # Neither is fixable from this repo: the formula is overwritten on
        # every release. `brew install` + `brew test` below are the real gate.
        run: |
          for f in Formula/*.rb; do
            name="baken667/tap/$(basename "$f" .rb)"
            echo "::group::brew audit $name"
            brew audit --online --except=style,version --formula "$name"
            echo "::endgroup::"
          done

      - name: Install and test
        if: steps.detect.outputs.count != '0'
        run: |
          for f in Formula/*.rb; do
            name="baken667/tap/$(basename "$f" .rb)"
            echo "::group::brew install $name"
            brew install --formula "$name"
            echo "::endgroup::"
            echo "::group::brew test $name"
            # No --formula here: brew test does not accept it.
            brew test "$name"
            echo "::endgroup::"
          done

name: Update formula

# This workflow is invoked by GoReleaser in baken/envee via repository_dispatch.
# See https://github.com/baken/envee/blob/main/.github/workflows/release.yml

on:
  repository_dispatch:
    types: [envee-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g. 0.5.0)"
        required: true
      sha256:
        description: "SHA256 of the source tarball"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set version and sha256
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=$(echo '${{ github.event.client_payload.version }}')" >> $GITHUB_OUTPUT
            echo "sha256=$(echo '${{ github.event.client_payload.sha256 }}')" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "sha256=${{ inputs.sha256 }}" >> $GITHUB_OUTPUT
          fi

      - name: Update Formula/envee.rb
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SHA256="${{ steps.meta.outputs.sha256 }}"
          sed -i.bak \
            -e "s|url \"https://github.com/baken/envee/archive/refs/tags/v.*\.tar.gz\"|url \"https://github.com/baken/envee/archive/refs/tags/v${VERSION}.tar.gz\"|" \
            -e "s|sha256 \".*\"|sha256 \"${SHA256}\"|" \
            Formula/envee.rb
          rm -f Formula/envee.rb.bak
          git diff Formula/envee.rb

      - name: Run audit
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          brew audit --strict --new Formula/envee.rb || true

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          title: "envee ${{ steps.meta.outputs.version }}"
          body: |
            Auto-generated by GoReleaser.

            - Version: ${{ steps.meta.outputs.version }}
            - SHA256: `${{ steps.meta.outputs.sha256 }}`
          branch: "envee-${{ steps.meta.outputs.version }}"
          commit-message: "envee: bump to ${{ steps.meta.outputs.version }}"
